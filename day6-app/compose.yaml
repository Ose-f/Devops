services:
  nginx:
    image: nginx:latest
    ports:
      - "8080:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app

  app:
    build: .
    environment:
      REDIS_HOST: redis
    expose:
      - "5000"
    depends_on:
      - redis

  redis:
    image: redis:latest
    volumes:
      - redis-data:/data

volumes:
  redis-data: